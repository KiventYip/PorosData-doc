# .github/workflows/deploy.yml
name: Deploy Documentation

# 不使用 paths 过滤：此前仅匹配 docs/**、mkdocs.yml 时，只改 requirements.txt、
# build_clean.py、.readthedocs.yaml 等不会触发部署，GitHub Pages 会长期停留在旧构建
# （表现为源码已更新但 Examples 等页面仍旧）。文档仓每次 main 推送执行一次部署可接受。
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整 Git 历史，确保"页面最后更新时间"功能准确

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 利用缓存加速构建

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build & Deploy to GitHub Pages
        # mkdocs-static-i18n 会自动处理多语言环境的嵌套部署
        run: |
          python build_clean.py gh-deploy --force