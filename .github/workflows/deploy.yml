# .github/workflows/deploy.yml
name: Deploy Documentation

# Do not use a `paths` filter: when the trigger only watched docs/** and
# mkdocs.yml, edits to requirements.txt, build_clean.py, .readthedocs.yaml
# etc. did not redeploy and GitHub Pages would drift behind the source.
# Running a deploy on every main push is acceptable for this docs repo.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history so the "last updated" plugin is accurate

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Cache wheels to speed up subsequent builds

      - name: Install image tooling (Material optimize plugin)
        run: sudo apt-get update && sudo apt-get install -y pngquant

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build & Deploy to GitHub Pages
        # CI=true enables the conditional plugins (optimize / privacy / social /
        # git-* / rss) that are off by default for fast local builds.
        env:
          CI: true
        # mkdocs-static-i18n stays in the build (English-only today; required
        # for Material blog integration via hooks/material_blog_i18n_posts.py).
        run: |
          python build_clean.py gh-deploy --force