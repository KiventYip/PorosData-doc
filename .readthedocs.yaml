# .readthedocs.yaml - ReadTheDocs MkDocs 配置 (版本 2)
version: 2

# 构建系统配置
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - pngquant

# MkDocs 配置 - 明确指定使用 MkDocs
mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: false  # 允许警告，但记录到日志

# Python 环境配置
python:
  install:
    - requirements: requirements.txt

# 搜索配置
search:
  ranking:
    title: 10
    headers: 8
    content: 5

# 构建产物配置 (可选 - 根据需要启用)
# formats:
#   - pdf      # 生成 PDF 版本
#   - htmlzip  # 生成 HTML 压缩包
#   - epub     # 生成 EPUB 版本 (如果适用)