# mkdocs.yml - PorosData documentation site configuration
site_name: PorosData
# Read the Docs serves under /en/latest/; keep this URL aligned with that base path
site_url: "https://porosdata-doc.readthedocs.io/en/latest/"
site_description: Data-Centric AI Processing Pipeline & Toolchain
site_author: PorosData Team
repo_url: https://github.com/KiventYip/PorosData-doc
repo_name: KiventYip/PorosData-doc
edit_uri: edit/main/docs/

# Build: allow warnings (known non-fatal cases)
strict: false

# ---------------------------------------------------------
# 1. Theme (Data-Centric AI design system)
# ---------------------------------------------------------
theme:
  name: material
  favicon: assets/images/favicon_link.png
  logo: assets/images/logo.png

  font:
    text: Roboto
    code: Roboto Mono

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    # navigation.instant: optional; this site no longer uses mkdocs-static-i18n—re-enable only after verifying Material behaviour locally.
    # - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer

    - toc.follow
    - toc.integrate

    - search.suggest
    - search.highlight
    - search.share

    - header.autohide

    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.footnote.tooltips
    - content.tooltips
    - content.tabs.link
    - content.action.edit
    - content.action.view

    - announce.dismiss

# ---------------------------------------------------------
# 2. Navigation
# ---------------------------------------------------------
nav:
  - Home: index.md

  - Getting Started:
      - Installation: get_started/installation.md
      - Quick Start: get_started/quickstart.md
      - End-to-End Workflow: get_started/end-to-end-workflow.md
      - Examples: get_started/examples.md

  - PorosData-Parser:
      - Overview: parser/index.md
      - Dataset Layout: parser/dataset-layout.md

  - PorosData-Processor:
      - Overview: processor/index.md
      - Data Governance: processor/data-governance.md

  - PorosData-Designer:
      - Overview: designer/index.md
      - Delivery Standards: designer/delivery-standards.md

  - Community:
      - Glossary: community/glossary.md
      - Abbreviations: includes/abbreviations.md
      - API Reference: community/api-reference.md
      - Design Philosophy: community/design-philosophy.md
      - Contributing: community/contributing.md
      - Document Formatting: community/document-formatting.md
      - Roadmap: community/roadmap.md
      - Changelog: community/changelog.md

  # Blog: Material blog plugin; nav only lists the index (posts/archives from the plugin)
  - Blog:
      - blog/index.md

# ---------------------------------------------------------
# 3. Plugins (English-only site; no mkdocs-static-i18n)
# ---------------------------------------------------------
plugins:
  - search:
      lang:
        - en
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

  # Directory-level default front matter; coordinates with Material blog where needed
  - meta

  - tags

  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      post_date_format: medium
      post_url_format: "posts/{slug}"
      post_readtime: true
      # Archive off by site policy (index + categories cover discovery)
      archive: false
      categories: true
      authors: true
      authors_file: "{blog}/.authors.yml"

  - optimize:
      enabled: !ENV [CI, false]
      cache: true
      cache_dir: .cache/plugins/optimize

  - privacy:
      enabled: !ENV [CI, false]
      cache: true
      cache_dir: .cache/plugins/privacy

  - social:
      enabled: !ENV [CI, false]
      cache: true
      cache_dir: .cache/plugins/social
      cards: true
      cards_layout_options:
        background_color: "#1a1a2e"
        color: "#ffffff"

  # After blog so post pages exist when git metadata runs
  - git-revision-date-localized:
      enabled: !ENV [CI, false]
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true

  - git-committers:
      enabled: !ENV [CI, false]
      repository: KiventYip/PorosData-doc
      branch: main

  - rss:
      enabled: !ENV [CI, false]
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date.created
      categories:
        - categories
        - tags

# ---------------------------------------------------------
# 4. Markdown extensions
# ---------------------------------------------------------
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      permalink_title: Anchor link to this section for reference
      toc_depth: 3

  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - pymdownx.tilde

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.keys
  - pymdownx.critic

# ---------------------------------------------------------
# 5. Extra JavaScript / CSS
# ---------------------------------------------------------
extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/custom.css

# ---------------------------------------------------------
# 6. Build / SEO
# ---------------------------------------------------------
exclude_docs: |
  /.*\.tmp$
  /temp/

copyright: |
  Copyright &copy; 2026 PorosData Team -
  <a href="https://github.com/KiventYip/PorosData-doc/blob/main/LICENSE">MIT License</a>

extra:
  # Version switcher: only enable with `mike deploy` (generates versions.json).
  # Without mike, Material would request /en/versions.json and spam 404s in `mkdocs serve`.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KiventYip/PorosData-doc
      name: GitHub Repository
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/porosdata-processor/
      name: PyPI Package
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/porosdata
      name: Twitter
    - icon: fontawesome/solid/paper-plane
      link: mailto:contact@porosdata.org
      name: Email Us

  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/KiventYip/PorosData-doc/issues/new/?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">opening an issue</a>.

  status:
    new: Recently added
    deprecated: Deprecated

# Material blog: ensure posts are included in the build set (see hook docstring).
# normalize_markdown_code_fences: trims redundant blank lines inside ``` fenced blocks.
hooks:
  - hooks/material_blog_i18n_posts.py
  - hooks/normalize_markdown_code_fences.py